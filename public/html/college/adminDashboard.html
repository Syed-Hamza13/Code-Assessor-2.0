<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>welcome to college dashboard</h1>
    <button>Logout</button>
    <style>
      .add-class-btn {
        background: #0078d4;
        color: #fff;
        border: none;
        padding: 8px 14px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
      }

      #overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #overlay.active { display: flex; }

      .card {
        background: #fff;
        border-radius: 10px;
        padding: 18px;
        width: 340px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        font-family: sans-serif;
      }
      .card h2 { margin: 0 0 12px; font-size: 18px; color:#111; }
      .field { margin-bottom: 10px; }
      .field label { display:block; font-size:13px; margin-bottom:6px; color:#333; }
      .field input, .field select {
        width:100%;
        padding:8px 10px;
        border:1px solid #e0e0e0;
        border-radius:6px;
        font-size:14px;
        box-sizing:border-box;
      }

      .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:8px; }
      .btn {
        padding:8px 12px;
        border-radius:6px;
        border: none;
        cursor: pointer;
        font-size:14px;
      }
      .btn.ghost { background: transparent; border: 1px solid #ccd0d6; color:#222; }
      .btn.primary { background:#0078d4; color:#fff; }
    </style>

    <button class="add-class-btn">Add Class</button>

    <div id="overlay" aria-hidden="true">
      <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
        <h2 id="cardTitle">Class Details</h2>
        <form id="classForm">
          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester" name="semester">
              <option value="">Select</option>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                <option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option>
              </select>
              </div>

              <div class="field">
              <label for="year">Year</label>
              <select id="year" name="year">
                <option value="">Select</option>
                <option value="1">First Year</option>
                <option value="2">Second Year</option>
                <option value="3">Third Year</option>
                <option value="4">Fourth Year</option>
              </select>
              </div>

              <div class="field">
              <label for="subject">Subject</label>
              <input id="subject" name="subject" type="text" placeholder="Subject name" />
              </div>

              <div class="field">
              <label for="branch">Branch</label>
              <select id="branch" name="branch">
                <option value="">Select</option>
                <option value="cse">Computer Science Engineering</option>
                <option value="eee">Electrical Engineering</option>
                <option value="mech">Mechanical Engineering</option>
                <option value="ece">Electronics and Telecommunication Engineering</option>
              </select>
              </div>

              <div class="actions">
              <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
              <button type="submit" class="btn primary" id="submitBtn">Submit</button>
              </div>
            </form>
            
          </div>

        </form>
      </div>
    </div>

    <script>
      const overlay = document.getElementById('overlay');
      const openBtn = document.querySelector('.add-class-btn');
      const cancelBtn = document.getElementById('cancelBtn');
      const form = document.getElementById('classForm');

      openBtn.addEventListener('click', () => {
        overlay.classList.add('active');
        overlay.setAttribute('aria-hidden', 'false');
        document.getElementById('semester').focus();
      });

      cancelBtn.addEventListener('click', () => {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
      });

      // close when clicking outside the card
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) {
          overlay.classList.remove('active');
          overlay.setAttribute('aria-hidden', 'true');
        }
      });

      // Submit should do nothing for now
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // intentionally left blank
      });
    </script>
  <script>
    // Check token before loading dashboard
    (async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/college/login";
        return;
      }

      const res = await fetch("/college/dashboard", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem("token");
        window.location.href = "/college/login";
      }
    })();
  </script>

  <!-- logout script -->
  <script>
    document.querySelector("button").addEventListener("click", async () => {
      const confirmLogout = confirm("Are you sure you want to logout?");
      if (!confirmLogout) return;

      try {
        const res = await fetch("/college/logout", {
          method: "POST",
          credentials: "include", // 👈 important, cookie bhejne ke liye
        });

        const data = await res.json();
        if (res.ok) {
          alert(data.message);
          window.location.href = "/college/login"; // 👈 redirect to login page
        } else {
          alert("Logout failed. Try again.");
        }
      } catch (err) {
        console.log("Logout error:", err);
        alert("Something went wrong.");
      }
    });
  </script>
  </body>
</html>
