<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Dashboard</title>
</head>

<body>
  <h1>Welcome to College Dashboard</h1>
  <button>Logout</button>
  <style>
    .add-class-btn {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #overlay.active {
      display: flex;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      font-family: sans-serif;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #111;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #333;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid #ccd0d6;
      color: #222;
    }

    .btn.primary {
      background: #0078d4;
      color: #fff;
    }

    /* add teacher enrol student styles */
    .container {
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .header {
      margin: 0 0 10px 0;
      color: #333;
    }

    .text {
      margin: 0;
      color: #666;
      font-weight: bold;
    }

    .button {
      padding: 10px 20px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .add-teacher {
      background-color: #007bff;
    }

    .add-student {
      background-color: #28a745;
    }

    .button-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    /* Overlay Styling */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .overlay-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 400px;
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    .overlay.active .overlay-content {
      transform: translateY(0);
    }

    .overlay-content h3 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group input[type="email"],
    .form-group input[type="file"] {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .overlay-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 25px;
    }

    .overlay-buttons .button {
      padding: 10px 18px;
      font-size: 15px;
    }

    .overlay-buttons .cancel-btn {
      background-color: #6c757d;
    }

    .overlay-buttons .action-btn {
      background-color: #007bff;
    }

    .overlay-buttons .action-btn:disabled {
      background-color: #99c2e6;
      cursor: not-allowed;
    }
  </style>

  <button id="addClassBtn" class="add-class-btn">Add Class</button>

  <div id="classList" class="grid-container"></div>

  <div id="overlay" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <h2 id="cardTitle">Class Details</h2>
      <form id="classForm">
        <div class="field">
          <label for="semester">Semester</label>
          <select id="semester" name="semester">
            <option value="">Select</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </div>

        <div class="field">
          <label for="year">Year</label>
          <select id="year" name="year">
            <option value="">Select</option>
            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
            <option value="4">Fourth Year</option>
          </select>
        </div>

        <div class="field">
          <label for="branch">Branch</label>
          <select id="branch" name="branch">
            <option value="">Select</option>
            <option value="cse">Computer Science Engineering</option>
            <option value="eee">Electrical Engineering</option>
            <option value="mech">Mechanical Engineering</option>
            <option value="ece">Electronics and Telecommunication Engineering</option>
          </select>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="Subject name" />
        </div>

        <div class="actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary" id="submitBtn">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <div class="button-container">
    <button class="button add-teacher" id="addTeacherBtn">Add Teacher</button>
    <button class="button add-student" id="addStudentBtn">Add Student</button>
  </div>

  <div id="addTeacherOverlay" class="overlay">
    <div class="overlay-content">
      <h3>Add Teacher</h3>
      <form id="addTeacherForm">
        <div class="form-group">
          <label for="teacherName">Teacher Name</label>
          <input type="text" id="teacherName" name="teacherName" required />
        </div>

        <div class="form-group">
          <label for="teacherId">Teacher ID</label>
          <input type="text" id="teacherId" name="teacherId" required />
        </div>

        <div class="form-group">
          <label for="teacherPassword">Teacher Password</label>
          <input type="password" id="teacherPassword" name="teacherPassword" required />
        </div>

        <div class="overlay-buttons">
          <button type="button" class="button cancel-btn" onclick="closeOverlay('addTeacherOverlay')">Cancel</button>
          <button type="submit" class="button action-btn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <div id="addStudentOverlay" class="overlay">
    <div class="overlay-content">
      <h3>Add Student</h3>
      <form id="addStudentForm">
        <div class="form-group" style="text-align: center; margin-bottom: 25px">
          <label style="font-size: 1.1em; color: #333">Choose Enrollment Method:</label>
          <div style="margin-top: 10px; display: flex; justify-content: center; gap: 20px;">
            <label>
              <input type="radio" name="addMethod" value="manual" id="radioManual" checked />
              Manual Form
            </label>
            <label>
              <input type="radio" name="addMethod" value="excel" id="radioExcel" />
              Excel Upload
            </label>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px" />

        <div id="manualaddSection">
          <div class="form-group">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" name="studentName" />
          </div>

          <div class="form-group">
            <label for="enrollmentNo">Enrollment No.</label>
            <input type="text" id="enrollmentNo" name="enrollmentNo" />
          </div>

          <div class="field">
            <label for="studentSemester">Semester</label>
            <select id="studentSemester" name="studentSemester">
              <option value="">Select</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>

          <div class="field">
            <label for="studentBranch">Branch</label>
            <select id="studentBranch" name="studentBranch">
              <option value="">Select</option>
              <option value="Computer Science Engineering">Computer Science Engineering</option>
              <option value="Electrical Engineering">Electrical Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
              <option value="Electronics and Telecommunication Engineering">Electronics and Telecommunication
                Engineering</option>
            </select>
          </div>

          <div class="field">
            <label for="studentYear">Year</label>
            <select id="studentYear" name="studentYear">
              <option value="">Select</option>
              <option value="1">First Year</option>
              <option value="2">Second Year</option>
              <option value="3">Third Year</option>
              <option value="4">Fourth Year</option>
            </select>
          </div>
        </div>

        <div id="excelUploadSection" style="display: none">
          <div class="form-group">
            <label for="excelFile">Select Excel File (.xlsx, .xls)</label>
            <input type="file" id="excelFile" name="excelFile" accept=".xlsx, .xls" />
          </div>
        </div>

        <div class="overlay-buttons">
          <button type="button" class="button cancel-btn" onclick="closeOverlay('addStudentOverlay')">Cancel</button>
          <button type="submit" class="button action-btn" id="finalAddBtn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <h2>Teachers List</h2>
  <div id="teachersContainer"></div>

  <h2>Students List</h2>
  <div id="studentsContainer"></div>

  <script>
    const overlay = document.getElementById('overlay');
    const openBtn = document.querySelector('.add-class-btn');
    const cancelBtn = document.getElementById('cancelBtn');
    const form = document.getElementById('classForm');

    openBtn.addEventListener('click', () => {
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');
      document.getElementById('semester').focus();
    });

    cancelBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
    });

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
    });
    // -------------------------
    // Auto-select YEAR from SEMESTER in ADD CLASS
    // -------------------------

    const classSemesterInput = document.getElementById("semester");
    const classYearInput = document.getElementById("year");

    // Disable year selection manually
    classYearInput.disabled = true;
    classYearInput.style.backgroundColor = "#f0f0f0";

    // Map semester → year
    const classSemToYearMap = {
      "1": "1", "2": "1",
      "3": "2", "4": "2",
      "5": "3", "6": "3",
      "7": "4", "8": "4"
    };

    classSemesterInput.addEventListener("change", () => {
      const s = classSemesterInput.value;
      classYearInput.value = classSemToYearMap[s] || "";
    });

  </script>

  <script>
    (async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/college/login";
        return;
      }

      const res = await fetch("/college/dashboard", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem("token");
        window.location.href = "/college/login";
      }
    })();
  </script>

  <script>
    document.querySelector("button").addEventListener("click", async () => {
      const confirmLogout = confirm("Are you sure you want to logout?");
      if (!confirmLogout) return;

      try {
        const res = await fetch("/college/logout", {
          method: "POST",
          credentials: "include",
        });

        const data = await res.json();
        if (res.ok) {
          alert(data.message);
          window.location.href = "/college/login";
        } else {
          alert("Logout failed. Try again.");
        }
      } catch (err) {
        console.log("Logout error:", err);
        alert("Something went wrong.");
      }
    });
  </script>

  <script>
    document.getElementById("addClassBtn").addEventListener("click", () => {
      overlay.style.display = "flex";
    });

    cancelBtn.addEventListener("click", () => {
      overlay.style.display = "none";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = {
        semester: form.semester.value,
        year: form.year.value,
        subject: form.subject.value,
        branch: form.branch.value
      };

      try {
        const res = await fetch("/college/create-class", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(formData)
        });

        const data = await res.json();
        if (res.ok) {
          alert("Class added successfully!");
          overlay.style.display = "none";
          loadClasses();
        } else {
          alert(data.message || "Failed to add class");
        }
      } catch (err) {
        console.error("Error:", err);
        alert("Something went wrong");
      }
    });

    let classesList = [];

    async function loadClasses() {
      const res = await fetch("/college/classes", { credentials: "include" });
      classesList = await res.json();
      const container = document.getElementById("classList");
      container.innerHTML = "";

      classesList.forEach(c => {
        const card = document.createElement("div");
        card.classList.add("class-card");
        card.innerHTML = `
          <h3>${c.subject}</h3>
          <p>Semester: ${c.semester}</p>
          <p>Year: ${c.year}</p>
          <p>Branch: ${c.branch}</p>
          <button class="manage-class-btn" data-class-id="${c._id}">Manage Class</button>
        `;
        container.appendChild(card);
      });
    }

    loadClasses();

    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("manage-class-btn")) {
        const classId = e.target.getAttribute("data-class-id");
        const selectedClass = classesList.find(c => c._id === classId);
        if (selectedClass) {
          localStorage.setItem("selectedClass", JSON.stringify(selectedClass));
          window.location.href = "/college/manage-class";
        }
      }
    });
  </script>

  <script>
    function closeOverlay(overlayId) {
      document.getElementById(overlayId).classList.remove("active");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const selectedClass = JSON.parse(localStorage.getItem("selectedClass"));

      if (!selectedClass) {
        alert("No class data found! Redirecting to dashboard.");
        window.location.href = "/college/dashboard";
        return;
      }

      const addTeacherBtn = document.getElementById("addTeacherBtn");
      const addTeacherOverlay = document.getElementById("addTeacherOverlay");
      const addTeacherForm = document.getElementById("addTeacherForm");

      addTeacherBtn.addEventListener("click", () => {
        addTeacherOverlay.classList.add("active");
      });

      addTeacherForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
          teacherName: document.getElementById("teacherName").value,
          teacherId: document.getElementById("teacherId").value,
          teacherPassword: document.getElementById("teacherPassword").value
        };

        try {
          const res = await fetch("/college/add-teacher", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(data)
          });

          const json = await res.json();

          if (res.ok) {
            alert("Teacher added!");
            loadTeachers();
            closeOverlay("addTeacherOverlay");
          } else {
            alert(json.message);
          }
        } catch (err) {
          console.log(err);
          alert("Failed to add teacher");
        }
      });

      const addStudentBtn = document.getElementById("addStudentBtn");
      const addStudentOverlay = document.getElementById("addStudentOverlay");
      const studentYearInput = document.getElementById("studentYear");
      const studentSemesterInput = document.getElementById("studentSemester");
      const addStudentForm = document.getElementById("addStudentForm");

      studentYearInput.disabled = true;
      studentYearInput.style.backgroundColor = "#f0f0f0";

      const semesterToYearMap = {
        "1": "1", "2": "1",
        "3": "2", "4": "2",
        "5": "3", "6": "3",
        "7": "4", "8": "4"
      };

      studentSemesterInput.addEventListener("change", () => {
        const selectedSemester = studentSemesterInput.value;
        if (selectedSemester && semesterToYearMap[selectedSemester]) {
          studentYearInput.value = semesterToYearMap[selectedSemester];
        } else {
          studentYearInput.value = "";
        }
      });

      const manualaddSection = document.getElementById("manualaddSection");
      const excelUploadSection = document.getElementById("excelUploadSection");
      const excelFileInput = document.getElementById("excelFile");
      const studentNameInput = document.getElementById("studentName");
      const enrollmentNoInput = document.getElementById("enrollmentNo");
      const finalAddBtn = document.getElementById("finalAddBtn");

      const radioManual = document.getElementById("radioManual");
      const radioExcel = document.getElementById("radioExcel");

      function switchaddmentMethod(method) {
        if (method === "manual") {
          manualaddSection.style.display = "block";
          excelUploadSection.style.display = "none";
          finalAddBtn.textContent = "Add";

          studentNameInput.required = true;
          enrollmentNoInput.required = true;
          excelFileInput.required = false;
          excelFileInput.value = "";
        } else if (method === "excel") {
          manualaddSection.style.display = "none";
          excelUploadSection.style.display = "block";
          finalAddBtn.textContent = "Upload & Add";

          studentNameInput.required = false;
          enrollmentNoInput.required = false;
          excelFileInput.required = true;
        }
      }

      radioManual.addEventListener("change", () => switchaddmentMethod("manual"));
      radioExcel.addEventListener("change", () => switchaddmentMethod("excel"));

      function resetaddForm() {
        addStudentForm.reset();
        radioManual.checked = true;
        switchaddmentMethod("manual");
      }

      addStudentBtn.addEventListener("click", () => {
        resetaddForm();
        addStudentOverlay.classList.add("active");
      });

      addStudentForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const isManualMode = radioManual.checked;

        if (isManualMode) {
          const data = {
            studentName: studentNameInput.value,
            enrollmentNo: enrollmentNoInput.value,
            semester: studentSemesterInput.value,
            branch: document.getElementById("studentBranch").value,
            year: studentYearInput.value,
          };

          try {
            const res = await fetch("/college/add-student", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              credentials: "include",
              body: JSON.stringify(data)
            });

            const json = await res.json();

            if (res.ok) {
              alert("Student added!");
              await loadStudents();
              resetaddForm();
              closeOverlay("addStudentOverlay");
            } else {
              alert(json.message);
            }
          } catch (err) {
            console.error(err);
            alert("Failed to add student");
          }
        } else {
          // Excel mode - FIXED
          if (excelFileInput.files.length === 0) {
            alert("Please select an Excel file to upload.");
            return;
          }

          finalAddBtn.disabled = true;
          finalAddBtn.textContent = "Uploading...";

          try {
            const formData = new FormData();
            formData.append("excelFile", excelFileInput.files[0]);

            const res = await fetch("/college/add-student-excel", {
              method: "POST",
              credentials: "include",
              body: formData
            });

            let json;
            const text = await res.text();
            try {
              json = JSON.parse(text);
            } catch (e) {
              json = null;
            }

            if (res.ok) {
              alert(json?.message || "All students added successfully!");
              await loadStudents();
              resetaddForm();
              closeOverlay("addStudentOverlay");
            } else {
              console.error("Upload failed response:", text);
              alert(json?.message || `Upload failed (${res.status}). See console.`);
            }
          } catch (err) {
            console.error("Excel upload error:", err);
            alert("Failed to upload Excel. Check console and server logs.");
          } finally {
            finalAddBtn.disabled = false;
            finalAddBtn.textContent = "Upload & Add";
          }
        }
      });

      addTeacherOverlay.addEventListener("click", (e) => {
        if (e.target === addTeacherOverlay) {
          closeOverlay("addTeacherOverlay");
        }
      });

      addStudentOverlay.addEventListener("click", (e) => {
        if (e.target === addStudentOverlay) {
          resetaddForm();
          closeOverlay("addStudentOverlay");
        }
      });

      async function loadTeachers() {
        const res = await fetch("/college/teachers", { credentials: "include" });
        const teachers = await res.json();

        const container = document.getElementById("teachersContainer");
        container.innerHTML = "";

        teachers.forEach(t => {
          const box = document.createElement("div");
          box.className = "teacher-item";
          box.innerHTML = `
            <p><b>${t.teacherName}</b></p>
            <p>ID: ${t.teacherId}</p>
          `;
          container.appendChild(box);
        });
      }
      loadTeachers();
    });
  </script>

  <script>
    async function loadStudents() {
      const res = await fetch("/college/students", { credentials: "include" });
      const students = await res.json();

      const container = document.getElementById("studentsContainer");
      container.innerHTML = "";

      const grouped = {};

      students.forEach(s => {
        if (!grouped[s.branch]) {
          grouped[s.branch] = {};
        }
        if (!grouped[s.branch][s.year]) {
          grouped[s.branch][s.year] = {};
        }
        if (!grouped[s.branch][s.year][s.semester]) {
          grouped[s.branch][s.year][s.semester] = [];
        }
        grouped[s.branch][s.year][s.semester].push(s);
      });

      Object.keys(grouped).sort().forEach(branch => {
        const branchDiv = document.createElement("div");
        branchDiv.style.marginBottom = "20px";
        branchDiv.style.border = "2px solid #0078d4";
        branchDiv.style.padding = "15px";
        branchDiv.style.borderRadius = "8px";
        branchDiv.style.backgroundColor = "#e8f0f7";

        const branchTitle = document.createElement("h2");
        branchTitle.textContent = `📚 ${branch}`;
        branchTitle.style.color = "#0078d4";
        branchTitle.style.marginTop = "0";
        branchDiv.appendChild(branchTitle);

        Object.keys(grouped[branch]).sort().forEach(year => {
          const yearDiv = document.createElement("div");
          yearDiv.style.marginBottom = "15px";
          yearDiv.style.border = "1px solid #999";
          yearDiv.style.padding = "12px";
          yearDiv.style.borderRadius = "6px";
          yearDiv.style.backgroundColor = "#f5f5f5";
          yearDiv.style.marginLeft = "20px";

          const yearTitle = document.createElement("h3");
          yearTitle.textContent = `📖 Year ${year}`;
          yearTitle.style.color = "#555";
          yearTitle.style.marginTop = "0";
          yearDiv.appendChild(yearTitle);

          Object.keys(grouped[branch][year]).sort((a, b) => a - b).forEach(semester => {
            const semDiv = document.createElement("div");
            semDiv.style.marginBottom = "12px";
            semDiv.style.border = "1px solid #ccc";
            semDiv.style.padding = "10px";
            semDiv.style.borderRadius = "4px";
            semDiv.style.backgroundColor = "#ffffff";
            semDiv.style.marginLeft = "20px";

            const semTitle = document.createElement("h4");
            semTitle.textContent = `📋 Semester ${semester}`;
            semTitle.style.color = "#333";
            semTitle.style.marginTop = "0";
            semDiv.appendChild(semTitle);

            const table = document.createElement("table");
            table.style.width = "100%";
            table.style.borderCollapse = "collapse";
            table.innerHTML = `
              <tr style="background-color: #d4e6f1; border-bottom: 1px solid #0078d4;">
                <th style="padding: 8px; text-align: left; border: 1px solid #ddd;">Name</th>
                <th style="padding: 8px; text-align: left; border: 1px solid #ddd;">Enrollment</th>
                <th style="padding: 8px; text-align: left; border: 1px solid #ddd;">Semester</th>
              </tr>
              ${grouped[branch][year][semester].map(s => `
                <tr style="border-bottom: 1px solid #ddd;">
                  <td style="padding: 8px; border: 1px solid #ddd;">${s.studentName}</td>
                  <td style="padding: 8px; border: 1px solid #ddd;">${s.enrollmentNo}</td>
                  <td style="padding: 8px; border: 1px solid #ddd;">${s.semester}</td>
                </tr>
              `).join("")}
            `;

            semDiv.appendChild(table);
            yearDiv.appendChild(semDiv);
          });

          branchDiv.appendChild(yearDiv);
        });

        container.appendChild(branchDiv);
      });
    }

    loadStudents();
  </script>


</body>

</html>
