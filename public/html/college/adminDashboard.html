<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>welcome to college dashboard</h1>
    <button>Logout</button>
  <script>
    // Check token before loading dashboard
    (async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/college/login";
        return;
      }

      const res = await fetch("/college/dashboard", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem("token");
        window.location.href = "/college/login";
      }
    })();
  </script>

  <!-- logout script -->
  <script>
    document.querySelector("button").addEventListener("click", async () => {
      const confirmLogout = confirm("Are you sure you want to logout?");
      if (!confirmLogout) return;

      try {
        const res = await fetch("/college/logout", {
          method: "POST",
          credentials: "include", // 👈 important, cookie bhejne ke liye
        });

        const data = await res.json();
        if (res.ok) {
          alert(data.message);
          window.location.href = "/college/login"; // 👈 redirect to login page
        } else {
          alert("Logout failed. Try again.");
        }
      } catch (err) {
        console.log("Logout error:", err);
        alert("Something went wrong.");
      }
    });
  </script>
  </body>
</html>
