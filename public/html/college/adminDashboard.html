<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
</head>

<body>
  <h1>welcome to college dashboard</h1>
  <button>Logout</button>
  <style>
    .add-class-btn {
      background: #0078d4;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #overlay.active {
      display: flex;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 18px;
      width: 340px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      font-family: sans-serif;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 18px;
      color: #111;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 13px;
      margin-bottom: 6px;
      color: #333;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 8px;
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .btn.ghost {
      background: transparent;
      border: 1px solid #ccd0d6;
      color: #222;
    }

    .btn.primary {
      background: #0078d4;
      color: #fff;
    }

    /* add teacher enrol student  styles */
    .container {
      padding: 20px;
      background-color: #f5f5f5;
      border-radius: 8px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .header {
      margin: 0 0 10px 0;
      color: #333;
    }

    .text {
      margin: 0;
      color: #666;
      font-weight: bold;
    }

    .button {
      padding: 10px 20px;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }

    .add-teacher {
      background-color: #007bff;
    }

    .add-student {
      background-color: #28a745;
    }

    .button-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    /* Overlay Styling */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      /* Initially hidden */
      visibility: hidden;
      /* Initially hidden */
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .overlay-content {
      background-color: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      width: 90%;
      max-width: 400px;
      transform: translateY(-20px);
      transition: transform 0.3s ease;
    }

    .overlay.active .overlay-content {
      transform: translateY(0);
    }

    .overlay-content h3 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }

    .form-group input[type="text"],
    .form-group input[type="password"],
    .form-group input[type="email"] {
      width: calc(100% - 20px);
      /* Adjust for padding */
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    .overlay-buttons {
      display: flex;
      justify-content: flex-end;
      /* Buttons right-aligned */
      gap: 10px;
      margin-top: 25px;
    }

    .overlay-buttons .button {
      padding: 10px 18px;
      font-size: 15px;
    }

    .overlay-buttons .cancel-btn {
      background-color: #6c757d;
      /* Grey */
    }

    .overlay-buttons .action-btn {
      background-color: #007bff;
      /* Blue for add */
    }
  </style>

  <button id="addClassBtn" class="add-class-btn">Add Class</button>

  <div id="classList" class="grid-container"></div>


  <div id="overlay" aria-hidden="true">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
      <h2 id="cardTitle">Class Details</h2>
      <form id="classForm">
        <div class="field">
          <label for="semester">Semester</label>
          <select id="semester" name="semester">
            <option value="">Select</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </div>

        <div class="field">
          <label for="year">Year</label>
          <select id="year" name="year">
            <option value="">Select</option>
            <option value="1">First Year</option>
            <option value="2">Second Year</option>
            <option value="3">Third Year</option>
            <option value="4">Fourth Year</option>
          </select>
        </div>


        <div class="field">
          <label for="branch">Branch</label>
          <select id="branch" name="branch">
            <option value="">Select</option>
            <option value="cse">Computer Science Engineering</option>
            <option value="eee">Electrical Engineering</option>
            <option value="mech">Mechanical Engineering</option>
            <option value="ece">Electronics and Telecommunication Engineering</option>
          </select>
        </div>

        <div class="field">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="Subject name" />
        </div>

        <div class="actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn primary" id="submitBtn">Submit</button>
        </div>
      </form>

    </div>


  </div>
  </div>
  <div class="button-container">
    <button class="button add-teacher" id="addTeacherBtn">
      Add Teacher
    </button>
    <button class="button add-student" id="addStudentBtn">
      Add Student
    </button>
  </div>
  <div id="addTeacherOverlay" class="overlay">
    <div class="overlay-content">
      <h3>Add Teacher</h3>
      <form id="addTeacherForm">
        <div class="form-group">
          <label for="teacherName">Teacher Name</label>
          <input type="text" id="teacherName" name="teacherName" required />
        </div>

        <div class="form-group">
          <label for="teacherId">Teacher ID</label>
          <input type="text" id="teacherId" name="teacherId" required />
        </div>
        <div class="form-group">
          <label for="teacherPassword">Teacher Password</label>
          <input type="password" id="teacherPassword" name="teacherPassword" required />
        </div>
        <div class="overlay-buttons">
          <button type="button" class="button cancel-btn" onclick="closeOverlay('addTeacherOverlay')">
            Cancel
          </button>
          <button type="submit" class="button action-btn">Add</button>
        </div>
      </form>
    </div>
  </div>

  <div id="addStudentOverlay" class="overlay">
    <div class="overlay-content">
      <h3>Add Student</h3>
      <form id="addStudentForm">
        <div class="form-group" style="text-align: center; margin-bottom: 25px">
          <label style="font-size: 1.1em; color: #333">Choose addment Method:</label>
          <div style="
                margin-top: 10px;
                display: flex;
                justify-content: center;
                gap: 20px;
              ">
            <label>
              <input type="radio" name="addMethod" value="manual" id="radioManual" checked />
              Manual Form
            </label>
            <label>
              <input type="radio" name="addMethod" value="excel" id="radioExcel" />
              Excel Upload
            </label>
          </div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px" />

        <div id="manualaddSection">
          <div class="form-group">
            <label for="studentName">Student Name</label>
            <input type="text" id="studentName" name="studentName" required />
          </div>
          <div class="form-group">
            <label for="addmentNo">addment No.</label>
            <input type="text" id="addmentNo" name="addmentNo" required />
          </div>

          <div class="field">
            <label for="studentSemester">Semester</label>
            <select id="studentSemester" name="studentSemester" required>
              <option value="">Select</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
              <option value="6">6</option>
              <option value="7">7</option>
              <option value="8">8</option>
            </select>
          </div>

          <div class="field">
            <label for="studentBranch">Branch</label>
            <select id="studentBranch" name="studentBranch" required>
              <option value="">Select</option>
              <option value="cse">Computer Science Engineering</option>
              <option value="eee">Electrical Engineering</option>
              <option value="mech">Mechanical Engineering</option>
              <option value="ece">Electronics and Telecommunication Engineering</option>
            </select>
          </div>

          <div class="field">
            <label for="studentYear">Year</label>
            <select id="studentYear" name="studentYear" required>
              <option value="">Select</option>
              <option value="1">First Year</option>
              <option value="2">Second Year</option>
              <option value="3">Third Year</option>
              <option value="4">Fourth Year</option>
            </select>
          </div>
        </div>

        <div id="excelUploadSection" style="display: none">
          <label for="excelFile" class="form-group" style="
                display: block;
                font-weight: bold;
                margin-bottom: 10px;
                text-align: center;
              ">
            Select Excel File (.xlsx, .xls)
          </label>
          <input type="file" id="excelFile" name="excelFile" accept=".xlsx, .xls" style="width: 100%" />
        </div>

        <div class="overlay-buttons">
          <button type="button" class="button cancel-btn" onclick="closeOverlay('addStudentOverlay')">
            Cancel
          </button>
          <button type="submit" class="button action-btn" id="finalAddBtn">
            add
          </button>
        </div>
      </form>
    </div>
  </div>
  <h2>Teachers List</h2>
  <div id="teachersContainer"></div>


  <script>
    const overlay = document.getElementById('overlay');
    const openBtn = document.querySelector('.add-class-btn');
    const cancelBtn = document.getElementById('cancelBtn');
    const form = document.getElementById('classForm');

    openBtn.addEventListener('click', () => {
      overlay.classList.add('active');
      overlay.setAttribute('aria-hidden', 'false');
      document.getElementById('semester').focus();
    });

    cancelBtn.addEventListener('click', () => {
      overlay.classList.remove('active');
      overlay.setAttribute('aria-hidden', 'true');
    });

    // close when clicking outside the card
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) {
        overlay.classList.remove('active');
        overlay.setAttribute('aria-hidden', 'true');
      }
    });

    // Submit should do nothing for now
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      // intentionally left blank
    });
  </script>
  <script>
    // Check token before loading dashboard
    (async () => {
      const token = localStorage.getItem("token");
      if (!token) {
        window.location.href = "/college/login";
        return;
      }

      const res = await fetch("/college/dashboard", {
        headers: { Authorization: `Bearer ${token}` },
      });

      if (res.status === 401 || res.status === 403) {
        localStorage.removeItem("token");
        window.location.href = "/college/login";
      }
    })();
  </script>

  <!-- logout script -->
  <script>
    document.querySelector("button").addEventListener("click", async () => {
      const confirmLogout = confirm("Are you sure you want to logout?");
      if (!confirmLogout) return;

      try {
        const res = await fetch("/college/logout", {
          method: "POST",
          credentials: "include", // 👈 important, cookie bhejne ke liye
        });

        const data = await res.json();
        if (res.ok) {
          alert(data.message);
          window.location.href = "/college/login"; // 👈 redirect to login page
        } else {
          alert("Logout failed. Try again.");
        }
      } catch (err) {
        console.log("Logout error:", err);
        alert("Something went wrong.");
      }
    });
  </script>

  <!-- adding classes and listing classes script  -->
  <script>

    // open overlay when "Add Class" clicked
    document.getElementById("addClassBtn").addEventListener("click", () => {
      overlay.style.display = "flex";
    });

    cancelBtn.addEventListener("click", () => {
      overlay.style.display = "none";
    });

    // submit form
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = {
        semester: form.semester.value,
        year: form.year.value,
        subject: form.subject.value,
        branch: form.branch.value
      };

      try {
        const res = await fetch("/college/create-class", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify(formData)
        });

        const data = await res.json();
        if (res.ok) {
          alert("Class added successfully!");
          overlay.style.display = "none";
          loadClasses();
        } else {
          alert(data.message || "Failed to add class");
        }
      } catch (err) {
        console.error("Error:", err);
        alert("Something went wrong");
      }
    });

    let classesList = [];

    async function loadClasses() {
      const res = await fetch("/college/classes", { credentials: "include" });
      classesList = await res.json();
      const container = document.getElementById("classList");
      container.innerHTML = "";

      classesList.forEach(c => {
        const card = document.createElement("div");
        card.classList.add("class-card");
        card.innerHTML = `
      <h3>${c.subject}</h3>
      <p>Semester: ${c.semester}</p>
      <p>Year: ${c.year}</p>
      <p>Branch: ${c.branch}</p>
      <button class="manage-class-btn" data-class-id="${c._id}">Manage Class</button>

    `;
        container.appendChild(card);
      });
    }

    // load classes on page load
    loadClasses();

    document.addEventListener("click", (e) => {
      if (e.target.classList.contains("manage-class-btn")) {
        const classId = e.target.getAttribute("data-class-id");
        const selectedClass = classesList.find(c => c._id === classId);
        if (selectedClass) {
          localStorage.setItem("selectedClass", JSON.stringify(selectedClass));
          window.location.href = "/college/manage-class";
        }
      }
    });

  </script>


  <!-- add teacher add student functionality  -->
  <script>
    // Function to close any overlay
    function closeOverlay(overlayId) {
      document.getElementById(overlayId).classList.remove("active");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const selectedClass = JSON.parse(localStorage.getItem("selectedClass"));

      if (!selectedClass) {
        alert("No class data found! Redirecting to dashboard.");
        window.location.href = "/college/dashboard";
        return;
      }

      // Display class details
      // document.getElementById("display-semester").textContent = selectedClass.semester;
      // document.getElementById("display-subject").textContent = selectedClass.subject;
      // document.getElementById("display-year").textContent =
      //   selectedClass.year;
      // document.getElementById("display-branch").textContent =
      //   selectedClass.branch;

      // --- add Teacher Overlay Logic ---
      const addTeacherBtn = document.getElementById("addTeacherBtn");
      const addTeacherOverlay = document.getElementById(
        "addTeacherOverlay"
      );
      const teacherSubjectInput = document.getElementById("teacherSubject");
      const teacherSemesterInput = document.getElementById("teacherSemester");
      const teacherBranchInput = document.getElementById("teacherBranch");
      const addTeacherForm = document.getElementById("addTeacherForm");

      addTeacherBtn.addEventListener("click", () => {
        // Pre-fill fields from selectedClass
        // teacherSubjectInput.value = selectedClass.subject;
        // teacherSemesterInput.value = selectedClass.semester;
        // teacherBranchInput.value = selectedClass.branch;
        addTeacherOverlay.classList.add("active"); // Show overlay
      });

      // Prevent form submission for add Teacher (as requested)
      addTeacherForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
          teacherName: document.getElementById("teacherName").value,
          teacherId: document.getElementById("teacherId").value,
          teacherPassword: document.getElementById("teacherPassword").value
        };

        try {
          const res = await fetch("/college/add-teacher", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify(data)
          });

          const json = await res.json();

          if (res.ok) {
            alert("Teacher added!");
            loadTeachers(); // neeche banayenge
            closeOverlay("addTeacherOverlay");
          } else {
            alert(json.message);
          }

        } catch (err) {
          console.log(err);
          alert("Failed to add teacher");
        }
      });


      // --- add Student Overlay Logic ---
      // --- add Student Overlay Logic ---
      const addStudentBtn = document.getElementById("addStudentBtn");
      const addStudentOverlay = document.getElementById(
        "addStudentOverlay"
      );
      const studentYearInput = document.getElementById("studentYear");
      const studentSemesterInput = document.getElementById("studentSemester");
      const studentBranchInput = document.getElementById("studentBranch");
      const addStudentForm = document.getElementById("addStudentForm");

      const manualaddSection = document.getElementById(
        "manualaddSection"
      );
      const excelUploadSection =
        document.getElementById("excelUploadSection");
      const excelFileInput = document.getElementById("excelFile");
      const studentNameInput = document.getElementById("studentName");
      const addmentNoInput = document.getElementById("addmentNo");
      const finalAddBtn = document.getElementById("finalAddBtn");

      const radioManual = document.getElementById("radioManual");
      const radioExcel = document.getElementById("radioExcel");

      // Function to manage field enablement/disabling based on method
      function switchaddmentMethod(method) {
        if (method === "manual") {
          // Manual Mode
          manualaddSection.style.display = "block";
          excelUploadSection.style.display = "none";
          finalAddBtn.textContent = "add";

          // Enable Manual Inputs, Set Required
          studentNameInput.required = true;
          addmentNoInput.required = true;
          manualaddSection
            .querySelectorAll("input:not([readonly])")
            .forEach((input) => (input.disabled = false));

          // Disable/Reset File Input
          excelFileInput.disabled = true;
          excelFileInput.required = false;
          excelFileInput.value = ""; // Clear selected file
        } else if (method === "excel") {
          // Excel Mode
          manualaddSection.style.display = "none";
          excelUploadSection.style.display = "block";
          finalAddBtn.textContent = "Upload & add";

          // Disable Manual Inputs, Remove Required
          studentNameInput.required = false;
          addmentNoInput.required = false;
          manualaddSection
            .querySelectorAll("input:not([readonly])")
            .forEach((input) => {
              input.disabled = true;
              input.value = ""; // Clear manual values
            });

          // Enable File Input, Set Required
          excelFileInput.disabled = false;
          excelFileInput.required = true;
        }
      }

      // Radio button listeners
      radioManual.addEventListener("change", () =>
        switchaddmentMethod("manual")
      );
      radioExcel.addEventListener("change", () =>
        switchaddmentMethod("excel")
      );

      // Function to reset the form state (called on open and close)
      function resetaddForm() {
        addStudentForm.reset();
        // Default to Manual Mode
        radioManual.checked = true;
        switchaddmentMethod("manual");
      }

      addStudentBtn.addEventListener("click", () => {
        // Reset form state every time it opens
        resetaddForm();



        addStudentOverlay.classList.add("active"); // Show overlay
      });

      // Prevent form submission for add Student (as requested)
      addStudentForm.addEventListener("submit", (e) => {
        e.preventDefault();

        const isManualMode = radioManual.checked;

        if (isManualMode) {
          // Manual mode
          // Since fields are set to required, form validation takes care of empty fields
          alert("Manual addment form submitted (action not implemented)");
        } else {
          // Excel mode
          if (excelFileInput.files.length === 0) {
            alert("Please select an Excel file to upload.");
            return;
          }
          alert("Excel File Upload (add action not implemented)");
        }

        // Reset form state before closing
        resetaddForm();
        closeOverlay("addStudentOverlay");
      });

      // Close overlays when clicking outside the content
      addTeacherOverlay.addEventListener("click", (e) => {
        if (e.target === addTeacherOverlay) {
          closeOverlay("addTeacherOverlay");
        }
      });
      addStudentOverlay.addEventListener("click", (e) => {
        if (e.target === addStudentOverlay) {
          // Reset add form when closing via click outside
          resetaddForm();
          closeOverlay("addStudentOverlay");
        }
      });

      async function loadTeachers() {
        const res = await fetch("/college/teachers", { credentials: "include" });
        const teachers = await res.json();

        const container = document.getElementById("teachersContainer");
        container.innerHTML = "";

        teachers.forEach(t => {
          const box = document.createElement("div");
          box.className = "teacher-item";
          box.innerHTML = `
      <p><b>${t.teacherName}</b></p>
      <p>ID: ${t.teacherId}</p>
    `;
          container.appendChild(box);
        });
      }
      loadTeachers()

    });

  </script>

</body>
