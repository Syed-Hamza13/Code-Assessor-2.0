<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Management</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        background-color: #f4f4f9;
        padding-top: 20px;
        box-sizing: border-box;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      .container {
        padding: 20px;
        background-color: #f5f5f5;
        border-radius: 8px;
        max-width: 600px;
        width: 100%;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
      }
      .header {
        margin: 0 0 10px 0;
        color: #333;
      }
      .text {
        margin: 0;
        color: #666;
        font-weight: bold;
      }
      .button {
        padding: 10px 20px;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
      }
      .assign-teacher {
        background-color: #007bff;
      }
      .enroll-student {
        background-color: #28a745;
      }
      .button-container {
        display: flex;
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }

      /* Overlay Styling */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0; /* Initially hidden */
        visibility: hidden; /* Initially hidden */
        transition: opacity 0.3s ease, visibility 0.3s ease;
      }
      .overlay.active {
        opacity: 1;
        visibility: visible;
      }
      .overlay-content {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        width: 90%;
        max-width: 400px;
        transform: translateY(-20px);
        transition: transform 0.3s ease;
      }
      .overlay.active .overlay-content {
        transform: translateY(0);
      }
      .overlay-content h3 {
        margin-top: 0;
        color: #333;
        text-align: center;
        margin-bottom: 20px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
      }
      .form-group input[type="text"],
      .form-group input[type="password"],
      .form-group input[type="email"] {
        width: calc(100% - 20px); /* Adjust for padding */
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
      }
      .overlay-buttons {
        display: flex;
        justify-content: flex-end; /* Buttons right-aligned */
        gap: 10px;
        margin-top: 25px;
      }
      .overlay-buttons .button {
        padding: 10px 18px;
        font-size: 15px;
      }
      .overlay-buttons .cancel-btn {
        background-color: #6c757d; /* Grey */
      }
      .overlay-buttons .action-btn {
        background-color: #007bff; /* Blue for Assign/Enroll */
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Class Management Page</h1>
    <div class="container">
      <div class="grid">
        <div>
          <h2 class="header">Semester</h2>
          <p class="text" id="display-semester">--</p>
        </div>
        <div>
          <h2 class="header">Subject</h2>
          <p class="text" id="display-subject">--</p>
        </div>
        <div>
          <h2 class="header">Year</h2>
          <p class="text" id="display-year">--</p>
        </div>
        <div>
          <h2 class="header">Branch</h2>
          <p class="text" id="display-branch">--</p>
        </div>
      </div>
      <div class="button-container">
        <button class="button assign-teacher" id="assignTeacherBtn">
          Assign Teacher
        </button>
        <button class="button enroll-student" id="enrollStudentBtn">
          Enroll Student
        </button>
      </div>
    </div>

    <div id="assignTeacherOverlay" class="overlay">
      <div class="overlay-content">
        <h3>Assign Teacher</h3>
        <form id="assignTeacherForm">
          <div class="form-group">
            <label for="teacherName">Teacher Name</label>
            <input type="text" id="teacherName" name="teacherName" required />
          </div>
          <div class="form-group">
            <label for="teacherSubject">Subject</label>
            <input
              type="text"
              id="teacherSubject"
              name="teacherSubject"
              readonly
            />
          </div>
          <div class="form-group">
            <label for="teacherSemester">Semester</label>
            <input
              type="text"
              id="teacherSemester"
              name="teacherSemester"
              readonly
            />
          </div>
          <div class="form-group">
            <label for="teacherBranch">Branch</label>
            <input
              type="text"
              id="teacherBranch"
              name="teacherBranch"
              readonly
            />
          </div>
          <div class="form-group">
            <label for="teacherId">Teacher ID</label>
            <input type="text" id="teacherId" name="teacherId" required />
          </div>
          <div class="form-group">
            <label for="teacherPassword">Teacher Password</label>
            <input
              type="password"
              id="teacherPassword"
              name="teacherPassword"
              required
            />
          </div>
          <div class="overlay-buttons">
            <button
              type="button"
              class="button cancel-btn"
              onclick="closeOverlay('assignTeacherOverlay')"
            >
              Cancel
            </button>
            <button type="submit" class="button action-btn">Assign</button>
          </div>
        </form>
      </div>
    </div>

    <div id="enrollStudentOverlay" class="overlay">
      <div class="overlay-content">
        <h3>Enroll Student</h3>
        <form id="enrollStudentForm">
          <div
            class="form-group"
            style="text-align: center; margin-bottom: 25px"
          >
            <label style="font-size: 1.1em; color: #333"
              >Choose Enrollment Method:</label
            >
            <div
              style="
                margin-top: 10px;
                display: flex;
                justify-content: center;
                gap: 20px;
              "
            >
              <label>
                <input
                  type="radio"
                  name="enrollMethod"
                  value="manual"
                  id="radioManual"
                  checked
                />
                Manual Form
              </label>
              <label>
                <input
                  type="radio"
                  name="enrollMethod"
                  value="excel"
                  id="radioExcel"
                />
                Excel Upload
              </label>
            </div>
          </div>

          <hr
            style="border: 0; border-top: 1px solid #eee; margin-bottom: 20px"
          />

          <div id="manualEnrollSection">
            <div class="form-group">
              <label for="studentName">Student Name</label>
              <input type="text" id="studentName" name="studentName" required />
            </div>
            <div class="form-group">
              <label for="enrollmentNo">Enrollment No.</label>
              <input
                type="text"
                id="enrollmentNo"
                name="enrollmentNo"
                required
              />
            </div>
            <div class="form-group">
              <label for="studentSubject">Subject</label>
              <input
                type="text"
                id="studentSubject"
                name="studentSubject"
                readonly
              />
            </div>
            <div class="form-group">
              <label for="studentSemester">Semester</label>
              <input
                type="text"
                id="studentSemester"
                name="studentSemester"
                readonly
              />
            </div>
            <div class="form-group">
              <label for="studentBranch">Branch</label>
              <input
                type="text"
                id="studentBranch"
                name="studentBranch"
                readonly
              />
            </div>
          </div>

          <div id="excelUploadSection" style="display: none">
            <label
              for="excelFile"
              class="form-group"
              style="
                display: block;
                font-weight: bold;
                margin-bottom: 10px;
                text-align: center;
              "
            >
              Select Excel File (.xlsx, .xls)
            </label>
            <input
              type="file"
              id="excelFile"
              name="excelFile"
              accept=".xlsx, .xls"
              style="width: 100%"
            />
          </div>

          <div class="overlay-buttons">
            <button
              type="button"
              class="button cancel-btn"
              onclick="closeOverlay('enrollStudentOverlay')"
            >
              Cancel
            </button>
            <button type="submit" class="button action-btn" id="finalEnrollBtn">
              Enroll
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      // Function to close any overlay
      function closeOverlay(overlayId) {
        document.getElementById(overlayId).classList.remove("active");
      }

      document.addEventListener("DOMContentLoaded", () => {
        const selectedClass = JSON.parse(localStorage.getItem("selectedClass"));

        if (!selectedClass) {
          alert("No class data found! Redirecting to dashboard.");
          window.location.href = "/college/dashboard";
          return;
        }

        // Display class details
        document.getElementById("display-semester").textContent =
          selectedClass.semester;
        document.getElementById("display-subject").textContent =
          selectedClass.subject;
        document.getElementById("display-year").textContent =
          selectedClass.year;
        document.getElementById("display-branch").textContent =
          selectedClass.branch;

        // --- Assign Teacher Overlay Logic ---
        const assignTeacherBtn = document.getElementById("assignTeacherBtn");
        const assignTeacherOverlay = document.getElementById(
          "assignTeacherOverlay"
        );
        const teacherSubjectInput = document.getElementById("teacherSubject");
        const teacherSemesterInput = document.getElementById("teacherSemester");
        const teacherBranchInput = document.getElementById("teacherBranch");
        const assignTeacherForm = document.getElementById("assignTeacherForm");

        assignTeacherBtn.addEventListener("click", () => {
          // Pre-fill fields from selectedClass
          teacherSubjectInput.value = selectedClass.subject;
          teacherSemesterInput.value = selectedClass.semester;
          teacherBranchInput.value = selectedClass.branch;
          assignTeacherOverlay.classList.add("active"); // Show overlay
        });

        // Prevent form submission for Assign Teacher (as requested)
        assignTeacherForm.addEventListener("submit", (e) => {
          e.preventDefault();
          alert("Teacher Assignment form submitted (action not implemented)");
          closeOverlay("assignTeacherOverlay");
        });

        // --- Enroll Student Overlay Logic ---
        // --- Enroll Student Overlay Logic ---
        const enrollStudentBtn = document.getElementById("enrollStudentBtn");
        const enrollStudentOverlay = document.getElementById(
          "enrollStudentOverlay"
        );
        const studentSubjectInput = document.getElementById("studentSubject");
        const studentSemesterInput = document.getElementById("studentSemester");
        const studentBranchInput = document.getElementById("studentBranch");
        const enrollStudentForm = document.getElementById("enrollStudentForm");

        const manualEnrollSection = document.getElementById(
          "manualEnrollSection"
        );
        const excelUploadSection =
          document.getElementById("excelUploadSection");
        const excelFileInput = document.getElementById("excelFile");
        const studentNameInput = document.getElementById("studentName");
        const enrollmentNoInput = document.getElementById("enrollmentNo");
        const finalEnrollBtn = document.getElementById("finalEnrollBtn");

        const radioManual = document.getElementById("radioManual");
        const radioExcel = document.getElementById("radioExcel");

        // Function to manage field enablement/disabling based on method
        function switchEnrollmentMethod(method) {
          if (method === "manual") {
            // Manual Mode
            manualEnrollSection.style.display = "block";
            excelUploadSection.style.display = "none";
            finalEnrollBtn.textContent = "Enroll";

            // Enable Manual Inputs, Set Required
            studentNameInput.required = true;
            enrollmentNoInput.required = true;
            manualEnrollSection
              .querySelectorAll("input:not([readonly])")
              .forEach((input) => (input.disabled = false));

            // Disable/Reset File Input
            excelFileInput.disabled = true;
            excelFileInput.required = false;
            excelFileInput.value = ""; // Clear selected file
          } else if (method === "excel") {
            // Excel Mode
            manualEnrollSection.style.display = "none";
            excelUploadSection.style.display = "block";
            finalEnrollBtn.textContent = "Upload & Enroll";

            // Disable Manual Inputs, Remove Required
            studentNameInput.required = false;
            enrollmentNoInput.required = false;
            manualEnrollSection
              .querySelectorAll("input:not([readonly])")
              .forEach((input) => {
                input.disabled = true;
                input.value = ""; // Clear manual values
              });

            // Enable File Input, Set Required
            excelFileInput.disabled = false;
            excelFileInput.required = true;
          }
        }

        // Radio button listeners
        radioManual.addEventListener("change", () =>
          switchEnrollmentMethod("manual")
        );
        radioExcel.addEventListener("change", () =>
          switchEnrollmentMethod("excel")
        );

        // Function to reset the form state (called on open and close)
        function resetEnrollForm() {
          enrollStudentForm.reset();
          // Default to Manual Mode
          radioManual.checked = true;
          switchEnrollmentMethod("manual");
        }

        enrollStudentBtn.addEventListener("click", () => {
          // Reset form state every time it opens
          resetEnrollForm();

          // Pre-fill hidden/readonly fields from selectedClass
          studentSubjectInput.value = selectedClass.subject;
          studentSemesterInput.value = selectedClass.semester;
          studentBranchInput.value = selectedClass.branch;

          enrollStudentOverlay.classList.add("active"); // Show overlay
        });

        // Prevent form submission for Enroll Student (as requested)
        enrollStudentForm.addEventListener("submit", (e) => {
          e.preventDefault();

          const isManualMode = radioManual.checked;

          if (isManualMode) {
            // Manual mode
            // Since fields are set to required, form validation takes care of empty fields
            alert("Manual Enrollment form submitted (action not implemented)");
          } else {
            // Excel mode
            if (excelFileInput.files.length === 0) {
              alert("Please select an Excel file to upload.");
              return;
            }
            alert("Excel File Upload (Enroll action not implemented)");
          }

          // Reset form state before closing
          resetEnrollForm();
          closeOverlay("enrollStudentOverlay");
        });
 
        // Close overlays when clicking outside the content
        assignTeacherOverlay.addEventListener("click", (e) => {
          if (e.target === assignTeacherOverlay) {
            closeOverlay("assignTeacherOverlay");
          }
        });
        enrollStudentOverlay.addEventListener("click", (e) => {
          if (e.target === enrollStudentOverlay) {
            // Reset enroll form when closing via click outside
            resetEnrollForm();
            closeOverlay("enrollStudentOverlay");
          }
        });
      });
    </script>
  </body>
</html>
