<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Sign Up</title>
    <style>
        /* Basic Styling for readability and structure */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .signup-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h1 {
            text-align: center;
            color: #17a2b8; /* Light Blue */
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        #signup-btn {
            width: 100%;
            padding: 12px;
            background-color: #28a745; /* Green */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            font-size: 16px;
        }

        .login-message {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login-message a {
            color: #007bff; /* Blue Link */
            text-decoration: none;
            font-weight: bold;
        }

        .login-message a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h1>Welcome to College Sign Up</h1>
        
        <form action="/college/signup" method="POST"> 
            
            <div class="input-group">
                <label for="collegeName">College Name</label>
                <input type="text" id="collegeName" name="collegeName" required>
            </div>

            <div class="input-group">
                <label for="collegeEmail">College Email</label>
                <input type="email" id="collegeEmail" name="collegeEmail" placeholder="e.g., info@college.edu" required>
            </div>

            <div class="input-group">
                <label for="password">Create Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="input-group">
                <label for="retypePassword">Retype Password</label>
                <input type="password" id="retypePassword" name="retypePassword" required>
            </div>

            <div class="input-group">
                <label for="collegeCity">College City</label>
                <input type="text" id="collegeCity" name="collegeCity" required>
            </div>

            <div class="input-group">
                <label for="collegeCode">College Code</label>
                <input type="text" id="collegeCode" name="collegeCode" placeholder="Unique Code" required>
            </div>

            <button type="submit" id="signup-btn">Sign Up</button>
        </form>
        <p class="login-message">
            If you already have an account, just 
            <a href="/college/login">Login</a>.
        </p>

    </div>

</body>
</html>
