<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Login</title>
    <style>
        /* Thodi si basic styling taaki thoda theek lage */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Padding boundary ke andar ho */
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 40%; /* Dono buttons ko same width dene ke liye */
        }

        #login-btn {
            background-color: #007bff;
            color: white;
        }

        #signup-btn {
            background-color: #28a745;
            color: white;
        }
        /* Sign Up Link ko button jaisa banana */
        #signup-link-btn {
            text-decoration: none; /* Link underline hatane ke liye */
            display: inline-block; /* Width aur padding ke liye */
            text-align: center;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 40%; 
            background-color: #28a745; /* Sign Up ka green color */
            color: white !important; /* Text color white rakhe */
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Teacher Login</h2>
        <form action="/teacher/login" method="POST" id="teacherLoginForm"> <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="teacherId" name="teacherUsername" placeholder="Enter Username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="teacherPassword" name="teacherPassword" placeholder="Enter Password" required>
            </div>
            
            <div class="buttons">
                <button type="submit" id="login-btn">Login</button>
            </div>
        </form>
    </div>
</body>
<script>
  const form = document.getElementById("teacherLoginForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const teacherId = document.getElementById("teacherId").value.trim();
    const password = document.getElementById("teacherPassword").value.trim();
 
    try {
      const res = await fetch("/teacher/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ teacherId, password }),
      });

      const data = await res.json();

      if (!res.ok) {
        alert(data.message || "Login failed");
        return;
      }

      // token localStorage me bhi rakh lo (agar future me headers se use karna ho)
      if (data.token) {
        localStorage.setItem("token", data.token);
      }

      window.location.href = data.redirect || "/teacher/dashboard";
    } catch (err) {
      console.error("Teacher login error:", err);
      alert("Something went wrong.");
    }
  });
</script>


</html>
